<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="319" height="64" viewBox="0 0 319 64" role="img" aria-label="Ver o que já entreguei"><title>Ver o que já entreguei</title><style>@font-face{font-family:fs;src:url(data:font/woff2;base64,) format("woff2")}
text{text-rendering:geometricPrecision}
.fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.wd{animation:wd .5s ease both}
