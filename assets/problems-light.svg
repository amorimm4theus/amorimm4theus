<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="406" viewBox="0 0 1280 406" role="img" aria-label="Problemas que eu resolvo: Um sistema simples no lugar da planilha; Integração que tenta de novo sozinha quando o outro sistema cai; App que manda a foto do canhoto direto para o sistema; Como arrumo o sistema que só uma pessoa entende"><title>Problemas que eu resolvo: Um sistema simples no lugar da planilha; Integração que tenta de novo sozinha quando o outro sistema cai; App que manda a foto do canhoto direto para o sistema; Como arrumo o sistema que só uma pessoa entende</title><style>@font-face{font-family:fm;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:fs;src:url(data:font/woff2;base64,) format("woff2")}
text{text-rendering:geometricPrecision}
.fu{animation:fu .9s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
@keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.wd{animation:wd .5s ease both}
@keyframes wd{from{opacity:.16}to{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{opacity:0;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.nudge{animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,60%,100%{transform:none}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
